  <style>

    .principal {
      display: flex;
      align-items: flex-start;
      gap: 40px;
      padding: 30px;
    }


    .menumenu {
      display: flex;
      flex-direction: column;
      width: 220px;
      gap: 15px;
    }

    .menubutton {
      padding: 12px;
      font-size: 16px;
      cursor: pointer;
    }


    #contenedor {
      flex: 1;
      text-align: center;
    }

    #contenedor img {
      display: none;
      width: 900px;
      max-width: 100%;
    }
  </style>
</head>

<body>

<div class="principal">

 
  <div class="menumenu">
    <button onclick="mostrarImagen(1)">Misión</button>
    <button onclick="mostrarImagen(2)">Visión</button>
    <button onclick="mostrarImagen(3)">Objetivo general</button>
    <button onclick="mostrarImagen(4)">Objetivo específico</button>
    <button onclick="mostrarImagen(5)">Cronograma</button>
    <button onclick="mostrarImagen(6)">pregunta.p</button>
  </div>


  <div id="contenedor">
    <img id="img1" src="mision.jpg" style="display:none; width:900px;">

    <img id="img3" src="objetivo general.jpg" style="display:none; width:900px;">
    <img id="img4" src="objetivo especifico.jpg" style="display:none; width:900px;">

  </div>

</div>

  <script>
    function mostrarImagen(num) {

  
      const imagenes = document.querySelectorAll("#contenedor img");

      imagenes.forEach(function(imagen) {
        imagen.style.display = "none";
      });

    
      document.getElementById("img" + num).style.display = "block";
    }
  </script>
    </script>
