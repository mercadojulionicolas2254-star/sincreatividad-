      <body>
        <h2><center></h2> </center>
    
      
        <img src="minilogo.png"><br>
        
      
        
      <style>
    
        .principal {
          display: flex;
          align-items: flex-start;
          gap: 40px;
          padding: 30px;
        }
    
    
        .menumenu {
          display: flex;
          flex-direction: column;
          width: 220px;
          gap: 15px;
        }
    
        .menubutton {
          padding: 12px;
          font-size: 16px;
          cursor: pointer;
        }
    
    
        #contenedor {
          flex: 1;
          text-align: center;
        }
    
        #contenedor img {
          display: none;
          width: 900px;
          max-width: 100%;
        }
      </style>
    </head>
    <main>
    <body>
    
    <div class="principal">
    
     
      <div class="menumenu">
        <button onclick="mostrarImagen(1)">resultados 1</button>
        <button onclick="mostrarImagen(2)">guia digital</button>
        <button onclick="mostrarImagen(3)">guia terminada</button>
        <button onclick="mostrarImagen(4)">aplicacion</button>
        <button onclick="mostrarImagen(5)">resultados 2</button>
      </div>
    
    
      <div id="contenedor">
        <img id="img1" src="re1.png" style="display:none; width:900px;">
        <img id="img2" src="guia digital.png" style="display:none; width:900px;">
        <img id="img3" src="guia escrita.jpg" style="display:none; width:900px;">
        <img id="img4" src="app1.png" style="display:none; width:900px;">
        <img id="img5" src="images.jpg" style="display:none; width:900px;">
      </div>
    
    </div>

    
      <script>
        function mostrarImagen(num) {
    
      
          const imagenes = document.querySelectorAll("#contenedor img");
    
          imagenes.forEach(function(imagen) {
            imagen.style.display = "none";
          });
    
        
          document.getElementById("img" + num).style.display = "block";
        }
      </script>
        </script></main>
       <img class="evidenciabanner" src="bnnrevdn.png" alt="none">
